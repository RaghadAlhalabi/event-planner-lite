<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b4d89" />
    <title>Offline | Event Planner Lite</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff0f7;
        color: #2b1b3f;
        padding: 1.5rem;
      }

      main {
        max-width: 40rem;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(109, 40, 217, 0.12);
        padding: 1.5rem;
      }

      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Event Planner Lite is running in offline mode.</p>
      <p>Reconnect to refresh account data and sync actions that require the network.</p>
    </main>
  </body>
</html>
